name: Bot de Ofertas

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  correr-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar librerias necesarias
        run: pip install -r requirements.txt

      - name: Correr el bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID_GRATIS: ${{ secrets.TELEGRAM_CHAT_ID_GRATIS }}
          TELEGRAM_CHAT_ID_PREMIUM: ${{ secrets.TELEGRAM_CHAT_ID_PREMIUM }}
        run: python cazador_ofertas.py nube

      - name: Guardar el historial actualizado de vuelta en GitHub
        run: |
          git config user.name "Bot de Ofertas"
          git config user.email "bot@users.noreply.github.com"
          git add historial_ofertas.json
          git diff --staged --quiet || git commit -m "Actualizar historial de ofertas"
          git push
